<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Quản lý chuyến đi')}"></head><body class="admin-body"><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container page"><div class="section-heading"><div><div class="eyebrow">Điều hành</div><h1 class="page-title">Chuyến đi.</h1><p class="muted">Tìm lịch, kiểm tra sức chứa và mở bán sau khi rà soát thông tin.</p></div><a class="button" href="/admin/chuyen-di/moi.html">+ Tạo chuyến</a></div><div th:replace="~{fragments :: messages}"></div>
<form action="/admin/chuyen-di.html" method="get" class="card admin-filters"><label class="filter-keyword">Tìm chuyến<input name="q" th:value="${q}" maxlength="100" placeholder="Mã chuyến khách cung cấp, địa điểm, đơn vị"></label><label>Loại vé<select th:replace="~{admin-fragments :: typeFilter}"></select></label><label>Trạng thái<select name="status"><option value="">Tất cả trạng thái</option><option th:each="s:${ {'MO_BAN','DONG_BAN','DA_KHOI_HANH','HOAN_THANH','DA_HUY'} }" th:value="${s}" th:selected="${status==s}" th:text="${s=='MO_BAN'?'Mở bán':s=='DONG_BAN'?'Đóng bán':s=='DA_KHOI_HANH'?'Đang hành trình':s=='HOAN_THANH'?'Hoàn thành':'Đã hủy'}"></option></select></label><label>Khởi hành từ<input type="date" name="start" th:value="${start}"></label><label>Đến ngày<input type="date" name="end" th:value="${end}"></label><button class="button">Lọc chuyến</button><a href="/admin/chuyen-di.html" class="text-link">Bỏ lọc</a></form>
<section class="card"><div th:replace="~{admin-fragments :: tripTable(${listing.rows})}"></div><nav th:replace="~{admin-fragments :: pagination}"></nav></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
