<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Nhật ký thao tác')}"></head><body class="admin-body"><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container page"><div class="eyebrow">Truy vết vận hành</div><h1 class="page-title">Nhật ký thao tác.</h1><p class="muted">Tra cứu lịch sử; không cho chỉnh sửa hoặc xóa nhật ký qua giao diện.</p><form class="card admin-filters" action="/admin/nhat-ky.html" method="get"><label class="filter-keyword">Tìm kiếm<input name="q" th:value="${q}" maxlength="100" placeholder="Tài khoản, mã đơn hoặc đối tượng"></label><label>Thao tác<select name="action"><option value="">Tất cả thao tác</option><option th:each="a:${actionLabels}" th:value="${a.key}" th:text="${a.value}" th:selected="${action==a.key}"></option></select></label><label>Từ ngày<input type="date" name="start" th:value="${start}"></label><label>Đến ngày<input type="date" name="end" th:value="${end}"></label><button class="button">Lọc nhật ký</button><a class="text-link" href="/admin/nhat-ky.html">Bỏ lọc</a></form><section class="card"><div class="table-scroll"><table><thead><tr><th>Thời gian</th><th>Tài khoản</th><th>Thao tác</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead><tbody><tr th:each="n:${listing.rows}"><td th:text="${#dates.format(n.NgayTao,'HH:mm:ss dd/MM/yyyy')}"></td><td th:text="${n.NguoiThucHien}"></td><td th:text="${actionLabels.containsKey(n.HanhDong)?actionLabels[n.HanhDong]:n.HanhDong}"></td><td th:text="${n.DoiTuong}"></td><td th:text="${n.NoiDung}"></td></tr><tr th:if="${#lists.isEmpty(listing.rows)}"><td colspan="5" class="admin-empty">Không có thao tác phù hợp.</td></tr></tbody></table></div><nav th:replace="~{admin-fragments :: pagination}"></nav></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
