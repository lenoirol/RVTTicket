<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đăng ký tài khoản')}"></head><body><header th:replace="~{fragments :: header('')}"></header>
<main id="main-content" class="container narrow page"><div class="eyebrow">Tài khoản khách hàng</div><h1 class="page-title">Lưu lại hành trình.</h1><p class="muted">Các đơn đặt khi đăng nhập sẽ xuất hiện trong tài khoản của bạn.</p><div th:replace="~{fragments :: messages}"></div>
<form class="card stack" method="post" th:action="@{/dang-ky}" th:object="${registration}" data-busy><label>Tên đăng nhập<input th:field="*{username}" required minlength="4" maxlength="40" pattern="[a-z0-9_]{4,40}" autocomplete="username"><small>4–40 ký tự: chữ thường không dấu, số hoặc dấu gạch dưới.</small></label><label>Họ tên<input th:field="*{name}" required maxlength="100" autocomplete="name"></label><label>Số điện thoại<input th:field="*{phone}" type="tel" pattern="[0-9]{10,15}" required autocomplete="tel"></label><label>Mật khẩu<input name="password" type="password" minlength="10" maxlength="64" required autocomplete="new-password"><small>10–64 ký tự, tối đa 72 byte. Không dùng mật khẩu ở dịch vụ khác.</small></label><button class="button wide">Tạo tài khoản</button></form><p>Đã có tài khoản? <a href="/login.html" class="text-link">Đăng nhập</a></p></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
