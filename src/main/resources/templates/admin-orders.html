<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Quản lý đơn vé')}"></head><body class="admin-body"><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container page"><div class="eyebrow">Vé &amp; hành khách</div><h1 class="page-title">Đơn đặt vé.</h1><p class="muted">Tra cứu, kiểm tra giao dịch và xác nhận lên xe / tàu.</p><div th:replace="~{fragments :: messages}"></div>
<form action="/admin/don-ve.html" method="get" class="card admin-filters"><label class="filter-keyword">Tìm đơn<input name="q" th:value="${q}" maxlength="100" placeholder="Mã đơn, tên khách, số điện thoại"></label><label>Loại vé<select th:replace="~{admin-fragments :: typeFilter}"></select></label><label>Trạng thái<select name="status"><option value="">Tất cả trạng thái</option><option th:each="s:${ {'GIU_CHO','DA_THANH_TOAN','DA_SU_DUNG','HET_HAN','DA_HUY'} }" th:value="${s}" th:selected="${status==s}" th:text="${s=='GIU_CHO'?'Chờ thanh toán':s=='DA_THANH_TOAN'?'Đã thanh toán':s=='DA_SU_DUNG'?'Đã sử dụng':s=='HET_HAN'?'Hết hạn':'Đã hủy'}"></option></select></label><label>Ngày đặt từ<input type="date" name="start" th:value="${start}"></label><label>Đến ngày<input type="date" name="end" th:value="${end}"></label><input th:if="${tripId!=null}" type="hidden" name="tripId" th:value="${tripId}"><button class="button">Lọc đơn</button><a href="/admin/don-ve.html" class="text-link">Bỏ lọc</a></form><p th:if="${tripId!=null}" class="notice">Đang lọc theo chuyến. Chọn “Bỏ lọc” để xem tất cả đơn.</p>
<section class="card"><div class="table-scroll"><table><thead><tr><th>Mã đơn / ngày đặt</th><th>Người đặt</th><th>Chuyến / hành trình</th><th>Số vé</th><th>Tổng đơn</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="o:${listing.rows}"><td><a class="text-link" th:href="@{/admin/don-ve/{code}(code=${o.MaDon})}" th:text="${o.MaDon}"></a><small th:text="${#dates.format(o.NgayTao,'HH:mm dd/MM/yyyy')}"></small></td><td><strong th:text="${o.HoTen}"></strong><small th:text="${o.SoDienThoai}"></small></td><td><a class="text-link" th:href="@{/admin/chuyen-di/{id}(id=${o.ChuyenDiID})}" th:text="${o.MaChuyenHienThi}"></a><small th:text="${o.NoiDi}+' → '+${o.NoiDen}"></small></td><td th:text="${o.SoVe}"></td><td th:text="${#numbers.formatDecimal(o.TongTien,0,'POINT',0,'COMMA')}+' ₫'"></td><td><span th:replace="~{fragments :: status(${o.TrangThai})}"></span></td></tr><tr th:if="${#lists.isEmpty(listing.rows)}"><td colspan="6" class="admin-empty">Không có đơn phù hợp với bộ lọc.</td></tr></tbody></table></div><nav th:replace="~{admin-fragments :: pagination}"></nav></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
