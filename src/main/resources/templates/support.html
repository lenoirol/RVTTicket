<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Yêu cầu hỗ trợ')}"></head><body><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container page">
<th:block th:unless="${supportAdmin}"><nav th:replace="~{fragments :: customerNav('support')}"></nav></th:block><div class="eyebrow" th:text="${supportAdmin?'Chăm sóc khách hàng':'Hỗ trợ của bạn'}"></div><h1 class="page-title">Yêu cầu hỗ trợ</h1><p class="muted" th:text="${supportAdmin?'Đọc vấn đề, đối chiếu đơn vé và trả lời khách tại cùng một nơi.':'Gửi vấn đề cho quản trị RVT. Theo dõi câu trả lời ngay tại đây, không qua email hoặc SMS.'}"></p><div th:replace="~{fragments :: messages}"></div>
<form action="" method="get" class="filter-bar"><label>Trạng thái<select name="status"><option value="">Tất cả</option><option value="MOI" th:selected="${status=='MOI'}">Chờ phản hồi</option><option value="DANG_XU_LY" th:selected="${status=='DANG_XU_LY'}">Đang xử lý</option><option value="DA_GIAI_QUYET" th:selected="${status=='DA_GIAI_QUYET'}">Đã giải quyết</option></select></label><button class="button outline">Lọc yêu cầu</button></form><div class="results-heading"><strong th:text="${listing.total}+' yêu cầu'"></strong><span th:text="'Trang '+${listing.page}"></span></div>
<div class="empty" th:if="${#lists.isEmpty(listing.rows)}"><h2>Chưa có yêu cầu ở mục này</h2><p th:unless="${supportAdmin}">Bạn có thể gửi yêu cầu bên dưới hoặc xem <a href="/huong-dan.html">hướng dẫn sử dụng</a>.</p></div>
<a class="card support-row" th:each="y:${listing.rows}" th:href="@{/{area}/ho-tro/{id}(area=${supportAdmin?'admin':'tai-khoan'},id=${y.YeuCauID})}"><div><small th:text="${y.MaYeuCau}+' · '+${#dates.format(y.CapNhatLuc,'HH:mm dd/MM/yyyy')}"></small><h3 th:text="${y.TieuDe}"></h3><p class="muted small-text" th:if="${supportAdmin}" th:text="${y.HoTen}"></p><p class="muted small-text" th:if="${y.MaDon!=null}" th:text="'Đơn '+${y.MaDon}"></p></div><span th:replace="~{fragments :: supportStatus(${y.TrangThai})}"></span></a>
<nav class="product-pagination" aria-label="Phân trang hỗ trợ"><a class="button outline" th:if="${listing.page>1}" th:href="@{${supportAdmin?'/admin/ho-tro':'/tai-khoan/ho-tro'}(status=${status},page=${listing.page-1})}">← Trước</a><a class="button outline" th:if="${listing.next}" th:href="@{${supportAdmin?'/admin/ho-tro':'/tai-khoan/ho-tro'}(status=${status},page=${listing.page+1})}">Tiếp</a></nav>
<form th:unless="${supportAdmin}" class="card stack section" th:action="@{/tai-khoan/ho-tro}" method="post" data-busy data-unsaved><h2>Gửi yêu cầu mới</h2><p class="muted small-text">Không gửi mật khẩu, số thẻ ngân hàng hay ảnh giấy tờ. Mỗi tài khoản có tối đa 5 yêu cầu chưa kết thúc.</p><div class="fields"><label>Mã đơn liên quan (nếu có)<input name="code" th:value="${draft!=null?draft.code:code}" maxlength="30" placeholder="RVT…"><small>Chỉ nhận đơn thuộc tài khoản của bạn.</small></label><label>Chủ đề<select name="topic" required><option th:each="t:${topics}" th:value="${t.key}" th:text="${t.value}" th:selected="${draft!=null &amp;&amp; draft.topic==t.key}"></option></select></label><label class="full">Tiêu đề<input name="title" th:value="${draft!=null?draft.title:''}" minlength="2" maxlength="120" required placeholder="Ví dụ: Cần xác nhận điểm đón"></label><label class="full">Nội dung<textarea name="content" minlength="10" maxlength="2000" rows="5" required th:text="${draft!=null?draft.content:''}" placeholder="Mô tả vấn đề và thông tin bạn cần được hỗ trợ"></textarea></label></div><button class="button">Gửi yêu cầu</button></form>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
