<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Quản lý chính sách')}"></head><body class="admin-body"><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container page"><nav th:replace="~{fragments :: workspace}"></nav><div class="eyebrow">Quản trị</div><h1 class="page-title">Chính sách đặt vé.</h1><p class="muted">Áp dụng cho đơn mới. Giá vé của đơn đã đặt được giữ nguyên. Phí hủy theo mốc thời gian được quy định trong Strategy của từng loại vé và hoàn phần còn lại vào số dư.</p><div th:replace="~{fragments :: messages}"></div>
<div class="transport-grid"><form th:each="r:${rules}" th:action="@{/admin/chinh-sach}" method="post" class="card stack" data-busy><h2 th:text="${r.LoaiVe=='XE_KHACH'?'Xe khách':'Tàu / thuyền'}"></h2><input type="hidden" name="type" th:value="${r.LoaiVe}"><label>Hành lý miễn phí (kg)<input type="number" name="allowance" min="0" step="0.5" th:max="${r.LoaiVe=='XE_KHACH'?30:40}" th:value="${r.MienPhiKg}" required></label><label>Hành lý tối đa (kg)<input type="number" name="maximum" min="0" step="0.5" th:max="${r.LoaiVe=='XE_KHACH'?30:40}" th:value="${r.ToiDaKg}" required></label><label>Phí vượt định mức (₫ / kg)<input type="number" name="rate" min="0" max="1000000" step="1000" th:value="${r.GiaMoiKg}" required></label><label>Được hủy trước khởi hành ít nhất (giờ)<input type="number" name="cancelHours" min="24" max="24" value="24" readonly required></label><button class="button">Lưu chính sách</button></form></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
