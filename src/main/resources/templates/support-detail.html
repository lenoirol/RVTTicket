<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chi tiết hỗ trợ')}"></head><body><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container narrow page">
<a class="text-link" th:href="@{${supportAdmin?'/admin/ho-tro':'/tai-khoan/ho-tro'}}">← Các yêu cầu hỗ trợ</a><div class="eyebrow section" th:text="${thread.MaYeuCau}"></div><h1 class="page-title" th:text="${thread.TieuDe}"></h1><p class="muted" th:text="${topics[thread.ChuDe]}+' · '+${#dates.format(thread.NgayTao,'HH:mm dd/MM/yyyy')}"></p><span th:replace="~{fragments :: supportStatus(${thread.TrangThai})}"></span>
<p th:if="${thread.MaDon!=null}"><a class="text-link" th:href="@{${supportAdmin?'/admin/don-ve/'+thread.MaDon:'/tai-khoan/don/'+thread.MaDon}}" th:text="'Xem đơn '+${thread.MaDon}+''"></a></p><div th:replace="~{fragments :: messages}"></div>
<section class="support-conversation section" aria-label="Nội dung trao đổi"><article class="support-message" th:classappend="${msg.TuQuanTri}?'from-admin'" th:each="msg:${messages}"><header><strong th:text="${msg.TuQuanTri?'Quản trị RVT':thread.HoTen}"></strong><time th:text="${#dates.format(msg.NgayTao,'HH:mm · dd/MM/yyyy')}"></time></header><p th:text="${msg.NoiDung}"></p></article></section>
<form class="card stack" method="post" th:action="@{/{area}/ho-tro/{id}(area=${supportAdmin?'admin':'tai-khoan'},id=${thread.YeuCauID})}" data-busy><h2 th:text="${supportAdmin?'Phản hồi khách hàng':'Bổ sung thông tin'}"></h2><p class="muted small-text" th:if="${thread.TrangThai=='DA_GIAI_QUYET' &amp;&amp; !supportAdmin}">Nếu cần trao đổi tiếp, gửi nội dung để mở lại yêu cầu này.</p><label>Nội dung<textarea name="content" minlength="2" maxlength="2000" required rows="5" th:text="${draftContent}"></textarea></label><label th:if="${supportAdmin}">Trạng thái sau phản hồi<select name="status"><option value="DANG_XU_LY">Tiếp tục xử lý</option><option value="DA_GIAI_QUYET">Đã giải quyết</option></select></label><button class="button" th:text="${supportAdmin?'Lưu phản hồi':'Gửi bổ sung'}"></button></form>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
