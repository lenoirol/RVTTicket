<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Lịch hẹn tư vấn')}"></head><body class="admin-body"><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container page"><div class="eyebrow">Tư vấn khách hàng</div><h1 class="page-title">Lịch hẹn tư vấn.</h1><p class="muted">Xác nhận lịch, ghi nhận đã tư vấn hoặc hủy theo quy trình: chờ xác nhận → đã xác nhận → đã tư vấn.</p><div th:replace="~{fragments :: messages}"></div>
<form action="/admin/lich-hen.html" method="get" class="card admin-filters"><label>Trạng thái<select name="status"><option value="">Tất cả trạng thái</option><option value="MOI" th:selected="${status=='MOI'}">Chờ xác nhận</option><option value="DA_XAC_NHAN" th:selected="${status=='DA_XAC_NHAN'}">Đã xác nhận</option><option value="HOAN_THANH" th:selected="${status=='HOAN_THANH'}">Đã tư vấn</option><option value="DA_HUY" th:selected="${status=='DA_HUY'}">Đã hủy</option></select></label><button class="button">Lọc lịch hẹn</button><a href="/admin/lich-hen.html" class="text-link">Bỏ lọc</a></form>
<section class="card"><div class="table-scroll"><table><thead><tr><th>Mã lịch hẹn</th><th>Loại vé</th><th>Ngày giờ</th><th>Khách</th><th>Nội dung</th><th>Trạng thái</th><th>Xử lý</th></tr></thead><tbody>
<tr th:each="a:${appointments}"><td><strong th:text="${a.code}"></strong><small th:if="${a.reservationCode!=null}" th:text="'Đơn '+${a.reservationCode}"></small></td><td th:text="${a.ticketType=='XE_KHACH'?'Xe khách':'Tàu / thuyền'}"></td><td th:text="${#temporals.format(a.date,'dd/MM/yyyy')}+' · '+${a.slot}"></td><td><strong th:text="${a.fullName}"></strong><small th:text="${a.phone}"></small></td><td th:text="${a.note}"></td><td><span th:replace="~{fragments :: appointmentStatus(${a.status})}"></span><small th:if="${a.handledBy!=null}" th:text="'Xử lý bởi '+${a.handledBy}"></small></td>
<td><form th:if="${a.status=='MOI'}" th:action="@{/admin/lich-hen/{c}/xac-nhan(c=${a.code})}" method="post"><button class="button small">Xác nhận</button></form>
<form th:if="${a.status=='DA_XAC_NHAN'}" th:action="@{/admin/lich-hen/{c}/hoan-thanh(c=${a.code})}" method="post"><button class="button small">Đã tư vấn</button></form>
<form th:if="${a.status=='MOI'||a.status=='DA_XAC_NHAN'}" th:action="@{/admin/lich-hen/{c}/huy(c=${a.code})}" method="post" data-confirm="Hủy lịch hẹn này?"><button class="button small outline">Hủy</button></form></td></tr>
<tr th:if="${#lists.isEmpty(appointments)}"><td colspan="7" class="admin-empty">Chưa có lịch hẹn phù hợp.</td></tr></tbody></table></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
