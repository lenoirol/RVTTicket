<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Thông tin chuyến')}"></head><body class="admin-body"><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container page"><nav th:replace="~{fragments :: workspace}"></nav><div class="eyebrow" th:text="${trip.MaChuyenHienThi}"></div><h1 class="page-title">Thông tin hành trình.</h1><p class="muted" th:text="${trip.NoiDi}+' → '+${trip.NoiDen}"></p><div th:replace="~{fragments :: messages}"></div>
<form class="card stack" th:action="@{/admin/chuyen-di/{id}/thong-tin(id=${trip.ChuyenDiID})}" method="post" data-busy><div class="fields"><label>Điểm đón / bến đi<input name="pickup" th:value="${trip.DiemDon}" maxlength="150" required></label><label>Điểm trả / bến đến<input name="dropoff" th:value="${trip.DiemTra}" maxlength="150" required></label><label class="full">Tiện ích thực tế<textarea name="amenities" maxlength="500" rows="3" th:text="${trip.TienIch}" placeholder="Chỉ ghi những tiện ích đã được xác nhận"></textarea></label><label class="full">Lưu ý hành trình<textarea name="description" maxlength="1000" rows="4" th:text="${trip.MoTa}"></textarea></label></div><p class="muted small-text">Thông tin mới hiển thị cho chuyến; điểm đón/trả trên đơn đã đặt không bị thay đổi.</p><button class="button">Lưu thông tin chuyến</button></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
