<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Kiểm tra mã QR vé')}"></head><body class="admin-body"><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container narrow page"><nav th:replace="~{fragments :: workspace}"></nav><div class="eyebrow">Quản trị · kiểm tra vé</div><h1 class="page-title">Quét mã vé.</h1><p class="muted">QR chứa mã xác thực riêng, không chứa họ tên, số điện thoại hoặc giấy tờ. Xem QR không tự đánh dấu vé đã sử dụng.</p><div th:replace="~{fragments :: messages}"></div><section class="card stack"><h2>Camera</h2><p class="muted small-text">Cần trình duyệt hỗ trợ đọc QR, HTTPS hoặc localhost và quyền camera. Nếu không hỗ trợ, chọn ảnh bên dưới.</p><video id="qr-video" playsinline muted hidden></video><div class="dialog-actions"><button type="button" class="button" id="qr-start">Mở camera</button><button type="button" class="button outline" id="qr-stop" disabled>Dừng camera</button></div><p role="status" id="qr-feedback" class="footnote"></p></section>
<form class="card stack" th:action="@{/admin/kiem-ve/anh}" method="post" enctype="multipart/form-data" data-busy><h2>Đọc QR từ ảnh</h2><label>Ảnh PNG / JPEG<input type="file" name="photo" accept="image/png,image/jpeg" required><small>Tối đa 4 MB, 12 triệu điểm ảnh. Không tải ảnh giấy tờ cá nhân.</small></label><button class="button">Đọc mã &amp; mở vé</button></form>
<form class="card stack" action="/admin/kiem-ve.html" method="get"><h2>Nhập mã kiểm tra</h2><label>Mã QR<input name="token" required maxlength="90" autocomplete="off" placeholder="RVT-TICKET:…"></label><button class="button outline">Kiểm tra vé</button></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
