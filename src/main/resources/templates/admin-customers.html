<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Khách hàng')}"></head><body class="admin-body"><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container page"><div class="eyebrow">Hồ sơ tài khoản</div><h1 class="page-title">Khách hàng.</h1><p class="muted">Quản lý tài khoản đăng ký. Khách đặt không có tài khoản vẫn xuất hiện trong danh sách đơn vé.</p><form class="card admin-filters" action="/admin/khach-hang.html" method="get"><label class="filter-keyword">Tìm khách<input name="q" th:value="${q}" maxlength="100" placeholder="Tên đăng nhập, họ tên, số điện thoại"></label><label>Trạng thái<select name="state"><option value="">Tất cả</option><option value="active" th:selected="${state=='active'}">Đang hoạt động</option><option value="locked" th:selected="${state=='locked'}">Đã khóa</option></select></label><button class="button">Lọc khách</button><a class="text-link" href="/admin/khach-hang.html">Bỏ lọc</a></form><section class="card"><div class="table-scroll"><table><thead><tr><th>Tài khoản</th><th>Khách hàng</th><th>Ngày đăng ký</th><th>Số đơn</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="a:${listing.rows}"><td><a class="text-link" th:href="@{/admin/khach-hang/{id}(id=${a.TaiKhoanID})}" th:text="${a.TenDangNhap}"></a></td><td><strong th:text="${a.HoTen}"></strong><small th:text="${a.SoDienThoai}"></small></td><td th:text="${#dates.format(a.NgayTao,'dd/MM/yyyy')}"></td><td th:text="${a.SoDon}"></td><td><span class="status" th:classappend="${!a.BiKhoa}?'paid'" th:text="${a.BiKhoa?'Đã khóa':'Hoạt động'}"></span></td><td><a class="button outline small" th:href="@{/admin/khach-hang/{id}(id=${a.TaiKhoanID})}">Hồ sơ &amp; lịch sử</a></td></tr><tr th:if="${#lists.isEmpty(listing.rows)}"><td colspan="6" class="admin-empty">Chưa có tài khoản phù hợp.</td></tr></tbody></table></div><nav th:replace="~{admin-fragments :: pagination}"></nav></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
