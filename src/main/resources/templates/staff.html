<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Xử lý đơn vé')}"></head><body class="admin-body"><header th:replace="~{fragments :: header('')}"></header><main id="main-content" class="container page"><nav th:replace="~{fragments :: workspace}"></nav><div class="section-heading"><div><div class="eyebrow">Quản trị · liên kết cũ</div><h1 class="page-title">Xử lý đơn vé.</h1><p class="muted">Tra cứu, xác nhận giao dịch thử và kiểm tra hành khách lên xe / tàu.</p></div><form th:action="@{/logout}" method="post"><button class="button outline">Đăng xuất</button></form></div>
<form action="/staff.html" class="staff-search" method="get"><label>Mã đơn hoặc số điện thoại<input name="q" th:value="${q}" maxlength="40" placeholder="RVT… hoặc 09…"></label><button class="button">Tìm đơn</button></form><section class="card"><h2>100 đơn gần nhất phù hợp</h2><div class="table-scroll"><table><thead><tr><th>Mã đơn</th><th>Người đặt</th><th>Hành trình</th><th>Khởi hành</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.MaDon}"></td><td><strong th:text="${o.HoTen}"></strong><small th:text="${o.SoDienThoai}"></small></td><td th:text="${o.NoiDi}+' → '+${o.NoiDen}"></td><td th:text="${#dates.format(o.KhoiHanh,'HH:mm dd/MM/yyyy')}"></td><td><span th:replace="~{fragments :: status(${o.TrangThai})}"></span></td><td><a class="button small outline" th:href="@{/admin/don-ve/{code}(code=${o.MaDon})}">Mở đơn</a></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="6">Chưa có đơn phù hợp.</td></tr></tbody></table></div></section></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
