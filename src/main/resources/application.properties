spring.application.name=RVT Ticket
spring.config.import=optional:file:./.local/vnpay.properties

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:RVTTicket};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# Lược đồ do db/migration (V2..V11) quản lý; Hibernate không tự tạo hay kiểm tra bảng.
spring.jpa.hibernate.ddl-auto=none
# Giữ nguyên tên bảng/cột khai báo trong @Table/@Column (không tự đổi sang snake_case).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
# HikariCP Connection Pooling (Tầng 4): giới hạn kết nối đồng thời để tối ưu tranh chấp khi nhiều khách đặt chỗ cùng lúc.
spring.datasource.hikari.pool-name=RVTTicketPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.port=${SERVER_PORT:8080}
spring.jackson.time-zone=Asia/Ho_Chi_Minh
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# VNPay Sandbox only. Enable after a public HTTPS callback and private credentials are configured.
rvt.vnpay.enabled=${VNPAY_ENABLED:false}
rvt.vnpay.tmn-code=${VNPAY_TMN_CODE:}
rvt.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
rvt.vnpay.public-base-url=${VNPAY_PUBLIC_BASE_URL:}
rvt.vnpay.return-origins=${VNPAY_RETURN_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
rvt.vnpay.query.enabled=${VNPAY_QUERY_ENABLED:false}
# Direct confirmation is not a payment gateway. Hidden/blocked in the web checkout by default.
rvt.payment.allow-demo=${RVT_ALLOW_DEMO_PAYMENT:false}

# Only this restricted loopback relay may be exposed by Funnel, never the main application port.
rvt.vnpay.relay.enabled=${VNPAY_RELAY_ENABLED:false}
rvt.vnpay.relay.port=${VNPAY_RELAY_PORT:8091}
rvt.vnpay.relay.private-base-url=${RVT_PRIVATE_BASE_URL:http://127.0.0.1:8080}
